[tasks.install]
description = "Symlink each skill dir flat into agent skill dirs"
run = """
set -e
for target in ~/.claude/skills ~/.pi/agent/skills; do
  rm -rf "$target"
  mkdir -p "$target"
  find "$MISE_PROJECT_ROOT/skills" -name SKILL.md | while read -r f; do
    d=$(dirname "$f")
    ln -s "$d" "$target/$(basename "$d")"
  done
done
"""
